[package]
name = "svgen"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
axum = { version = "0.7", optional = true }
clap = { version = "4", features = ["derive"] }
quick-xml = "0.38"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"], optional = true }

[features]
api = ["axum", "tokio"]
