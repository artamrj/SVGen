[project]
name = "svgen"
version = "0.3.0"
description = "Text-to-SVG icon generator: a LoRA fine-tuned code LLM that draws black-and-white line icons"
readme = "README.md"
license = "MIT"
authors = [{ name = "Arta" }]
keywords = ["svg", "text-to-svg", "icons", "mlx", "lora", "llm", "vector-graphics"]
requires-python = ">=3.10"
dependencies = [
  "mlx-lm>=0.32",
  "pillow>=11",
  "numpy>=1.26",
  "safetensors>=0.4",
]

[project.urls]
Repository = "https://github.com/artamrj/SVGen"

[project.optional-dependencies]
rerank = [
  "torch>=2.3",
  "open_clip_torch>=3.0",
]
dev = [
  "pytest>=8.0",
]

[project.scripts]
svgen = "svgen.generate:main"

[tool.setuptools]
packages = ["svgen", "training"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
