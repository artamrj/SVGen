[project]
name = "svgen"
version = "0.2.5"
description = "Truthful tiny-generator milestone for the SVGen text-to-SVG model project"
requires-python = ">=3.10"
dependencies = [
  "safetensors>=0.4",
  "torch>=2.3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
