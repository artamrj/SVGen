project:
  name: SVGen
  version: "0.2.5"
  artifact_dir: exports/svgen-0.2.5

data:
  train_path: data/train_1000.jsonl
  validation_path: data/sample/dataset.jsonl
  max_sequence_length: 1024

training:
  seed: 42
  batch_size: 8
  epochs: 1
  learning_rate: 0.0003
  checkpoint_dir: checkpoints/svgen-0.2.5

tokenizer:
  path: tokenizer/tokenizer.json
  vocab_size: 4096

model:
  layers: 4
  hidden: 256
  heads: 4
  context: 1024
